# Family identity and notice strings. The name-table strings (IDs 0, the
# suffix on 9, 10 and 13) are templated from these values in assemble.py,
# and OFL.txt / FONTLOG.txt carry the same wording.
#
# There is deliberately no `version` here: the version is the newest
# FONTLOG.txt ChangeLog entry, which merging to main turns into the release
# tag and which the build reads back from it (see README, "Releasing").
# A `version` key left in this file is refused, not ignored.

family      = "Asterwell Text"
ps_family   = "AsterwellText"
vendor_id   = "ASTW"
repo_url    = "https://github.com/BestFriendChris/asterwell-font"
license_url = "https://openfontlicense.org"
copyright_holder = "The Asterwell Text Project Authors (https://github.com/BestFriendChris/asterwell-font)"
copyright_year   = "2026"             # the year on line 1 of OFL.txt; both must agree
reserved_font_name = "Asterwell"      # "" to declare no Reserved Font Name
