[project]
name = "asterwell-build"
version = "0"                      # the *font* version lives in sources/family.toml
description = "Build pipeline for the Asterwell Text font family"
requires-python = "==3.13.*"
dependencies = [
  "fonttools[woff,unicode,pathops]==4.64.0",   # woff→brotli+zopfli, unicode→unicodedata2, pathops→skia-pathops
  "skia-pathops==0.9.2",
  "brotli==1.2.0",
  "uharfbuzz==0.56.1",                          # shaping checks (qa)
  "fontbakery==1.1.0",                          # QA profile runner
  "regex==2026.9.3",                            # \p{Emoji_Presentation} for the allowlist flag
]
[project.scripts]
asterwell-build = "asterwell_build.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/asterwell_build"]
